name = "cloudflare-docker-proxy"
compatibility_date = "2023-12-01"

[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"

[env.vars]
CUSTOM_DOMAIN = "sunc.cc"
YARN_ENABLE_IMMUTABLE_INSTALLS = false

[env.dev.vars]
MODE = "debug"
TARGET_UPSTREAM = "https://registry-1.docker.io"
CUSTOM_DOMAIN = "sunc.cc"

[env.production]
name = "cloudflare-docker-proxy"
routes = [
  { pattern = "lm-docker.sunc.cc", custom_domain = true },
  { pattern = "lm-quay.sunc.cc", custom_domain = true },
  { pattern = "lm-gcr.sunc.cc", custom_domain = true },
  { pattern = "lm-k8s-gcr.sunc.cc", custom_domain = true },
  { pattern = "lm-k8s.sunc.cc", custom_domain = true },
  { pattern = "lm-ghcr.sunc.cc", custom_domain = true },
  { pattern = "lm-cloudsmith.sunc.cc", custom_domain = true },
]

[env.production.vars]
MODE = "production"
TARGET_UPSTREAM = ""
YARN_ENABLE_IMMUTABLE_INSTALLS = false

[env.staging]
name = "cloudflare-docker-proxy-staging"
# route = { pattern = "docker-staging.libcuda.so", custom_domain = true }

[env.staging.vars]
MODE = "staging"
TARGET_UPSTREAM = ""
